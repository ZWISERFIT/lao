[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lao-human-calibration"
version = "0.1.0"
description = "The Human-Calibration Layer for Your Agents — 让 Agent 不再忘事、不再胡说，像人一样靠谱"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "ZWISERFIT" }]
keywords = ["llm", "agent", "markov-chain", "intention-decay", "memory", "hallucination", "human-calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ZWISERFIT/lao"
Repository = "https://github.com/ZWISERFIT/lao"
Documentation = "https://github.com/ZWISERFIT/lao#readme"
Issues = "https://github.com/ZWISERFIT/lao/issues"

[tool.setuptools]
packages = [
    "lao",
    "lao.core",
    "lao.evolution",
]

[tool.setuptools.package-data]
lao = ["py.typed"]

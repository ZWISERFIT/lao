[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lao-human-calibration"
version = "0.2.0-beta"
description = "LAO — Logically Anchored Ontology. 让 Agent 不再忘事、不再胡说，像人一样记住真实经验并自动复利。BMC行为预测 + 五引擎 Agent 可靠性层。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "ZWISERFIT 9-Agent Collective" }]
keywords = ["llm", "agent", "markov-chain", "intention-decay", "memory", "hallucination", "human-calibration", "reliability", "ontology", "cognitive-anchor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jsonschema>=4.0",
]
cli = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ZWISERFIT/lao"
Repository = "https://github.com/ZWISERFIT/lao"
Documentation = "https://github.com/ZWISERFIT/lao#readme"
Issues = "https://github.com/ZWISERFIT/lao/issues"
Discussions = "https://github.com/ZWISERFIT/ZWISERFIT/discussions"

[project.scripts]
lao = "lao.cli:main"

[tool.setuptools]
packages = [
    "lao",
    "lao.core",
    "lao.evolution",
    "lao.effect_anchored",
    "lao.effect_anchored.routing",
    "lao.effect_anchored.evolution",
    "lao.effect_anchored.interaction",
    "lao.effect_anchored.ethan",
    "lao.effect_anchored.melody",
    "lao.effect_anchored.validation",
]
include-package-data = true

[tool.setuptools.package-data]
"lao" = ["py.typed", "*.html", "*.json"]
